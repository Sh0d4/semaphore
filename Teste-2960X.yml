---
- name: Coletar informações do switch (2960X legado)
  hosts: SAOTS016
  gather_facts: no

  tasks:

    - name: Coletar running-config
      raw: show running-config
      register: run_result

    - name: Coletar status das interfaces
      raw: show interface status
      register: intf_result

    - name: Salvar outputs em arquivo (nomeado pelo IP)
      delegate_to: localhost
      ansible.builtin.copy:
        content: |
          Host: {{ inventory_hostname }}
          Time: {{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}

          --- Running Config ---
          {{ run_result.stdout | default('Sem saída') }}

          --- Interface Status ---
          {{ intf_result.stdout | default('Sem saída') }}
        dest: "/srv/semaphore-backups/{{ (ansible_host | default(inventory_hostname)) }}.txt"
        owner: saoevcar
        group: saoevcar
        mode: '0664'
