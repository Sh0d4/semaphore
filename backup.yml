---
- name: Save config and capture interface status on Cisco IOS switches
  hosts: ios_switches
  gather_facts: no

  tasks:

    - name: Salvar configuração no switch
      ios_config:
        save_when: always

    - name: Coletar running-config
      ios_command:
        commands:
          - show running-config
      register: run_result

    - name: Coletar status das interfaces
      ios_command:
        commands:
          - show interfaces status
      register: intf_result

    - name: Salvar outputs em arquivo (nomeado pelo IP)
      delegate_to: localhost
      ansible.builtin.copy:
        content: |
          Host: {{ inventory_hostname }}
          Time: {{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}

          --- Running Config ---
          {{ run_result.stdout[0] | default('Sem saída') }}

          --- Interface Status ---
          {{ intf_result.stdout[0] | default('Sem saída') }}
        dest: "/srv/semaphore-backups/{{ (ansible_host | default(inventory_hostname)) }}.txt"
        owner: saoevcar
        group: users
        mode: '0664'
