- name: Backup Cisco IOS configs
  hosts: switches
  gather_facts: no
  tasks:
    - name: Garantir pasta de backup
      file:
        path: /home/semaphore/backup
        state: directory
        mode: '0775'
      delegate_to: localhost

    - name: Salvar running-config
      ios_command:
        commands:
          - show running-config
      register: running

    - name: Gravar running-config em arquivo
      copy:
        content: "{{ running.stdout[0] }}"
        dest: "/home/semaphore/backup/{{ inventory_hostname }}-running-config.txt"
      delegate_to: localhost

    - name: Salvar show interfaces status
      ios_command:
        commands:
          - show interfaces status
      register: interfaces

    - name: Gravar interfaces em arquivo
      copy:
        content: "{{ interfaces.stdout[0] }}"
        dest: "/home/semaphore/backup/{{ inventory_hostname }}-interfaces.txt"
      delegate_to: localhost
