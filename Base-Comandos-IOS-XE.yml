---
- name: Aplicar comandos individualmente e registrar alterações
  hosts: ios_switches
  gather_facts: no

  tasks:

    - name: Remover kron occurrence
      ios_config:
        lines:
          - no kron occurrence DAILY-BACKUP at 11:15 recurring
        save_when: never
      register: kron_occ
      ignore_errors: yes

    - name: Remover kron policy-list
      ios_config:
        lines:
          - no kron policy-list DAILY-BACKUP
        save_when: never
      register: kron_policy
      ignore_errors: yes

    - name: Remover logging host 10.10.21.81
      ios_config:
        lines:
          - no logging host 10.10.21.81
        save_when: never
      register: log1
      ignore_errors: yes

    - name: Remover archive
      ios_config:
        lines:
          - no archive
        save_when: never
      register: archive
      ignore_errors: yes

    - name: Remover ftp username
      ios_config:
        lines:
          - no ip ftp username swbkftp
        save_when: never
      register: ftp_user
      ignore_errors: yes

    - name: Remover ftp password
      ios_config:
        lines:
          - no ip ftp password Flex.123
        save_when: never
      register: ftp_pass
      ignore_errors: yes

    - name: Remover logging host 10.110.10.44
      ios_config:
        lines:
          - no logging host 10.110.10.44 transport udp port 11001
        save_when: always
      register: log2
      ignore_errors: yes

    - name: Coletar running-config atualizado
      ios_command:
        commands:
          - show running-config
      register: run_result

    - name: Consolidar resultados em arquivo
      delegate_to: localhost
      ansible.builtin.copy:
        content: |
          Host: {{ inventory_hostname }}
          Time: {{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}

          --- Resultados das alterações ---
          Kron occurrence: {{ kron_occ.module_stderr | default('OK') }}
          Kron policy: {{ kron_policy.module_stderr | default('OK') }}
          Logging 10.10.21.81: {{ log1.module_stderr | default('OK') }}
          Archive: {{ archive.module_stderr | default('OK') }}
          FTP user: {{ ftp_user.module_stderr | default('OK') }}
          FTP pass: {{ ftp_pass.module_stderr | default('OK') }}
          Logging 10.110.10.44: {{ log2.module_stderr | default('OK') }}

          --- Running Config ---
          {{ run_result.stdout[0] | default('Sem saída') }}
        dest: "/srv/semaphore-backups/{{ (ansible_host | default(inventory_hostname)) }}-alteracoes.txt"
        owner: saoevcar
        group: saoevcar
        mode: '0664'
